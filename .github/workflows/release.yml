name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate tag and package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $cmakeVersion = Select-String -Path CMakeLists.txt -Pattern 'project\(EasyRec2 VERSION ([^ ]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($version -ne $cmakeVersion) {
            throw "Tag version $version does not match CMake project version $cmakeVersion"
          }
          ./package.ps1 -Version $version

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --generate-notes --title "簡易録音2 $env:GITHUB_REF_NAME"
