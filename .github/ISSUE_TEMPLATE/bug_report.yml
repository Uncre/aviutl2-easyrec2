name: 不具合報告
description: 再現できる問題を報告します
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: easyrec2_version
    attributes:
      label: EasyRec2のバージョン
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: aviutl2_version
    attributes:
      label: AviUtl 2のバージョン
      placeholder: 2.1.7a
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: 出力形式
      options: [WAV, FLAC, MP3, AAC (M4A), Opus, 該当なし]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: どの操作をすると何が起きるか、順番に記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: ログ・補足
      description: 個人情報や録音内容を含まないことを確認してから貼り付けてください。
