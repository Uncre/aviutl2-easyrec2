name: 機能要望
description: 新機能や改善案を提案します
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと
      description: 現在どのような場面で困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望する動作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替手段・補足
